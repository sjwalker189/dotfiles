[colors]
background = #222222
foreground = #dddddd
primary = #82AAFF
secondary = #EEAABB
alert = #FF5555

[bar/main]
; monitor = ${env:MONITOR:HDMI-A-1} ; Adjust if you have multiple monitors
width = 100%
height = 30
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = #f00

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = " " ; You had spacing in Waybar, this acts as a separator
separator-foreground = ${colors.foreground}

font-0 = Hack Nerd Font:size=10;3
font-1 = Noto Color Emoji:size=10;3 ; For emoji support if you use them

modules-left = hyprland-workspaces
modules-center = mpris
modules-right = battery pulseaudio network clock tray

tray-position = right
tray-padding = 10
tray-background = ${colors.background}

; Waybar had "exclusive": true, which is the default for Polybar's
; "wm-restack = i3" if you are using i3. For other WMs like Hyprland,
; Polybar does not manage windows, so it won't be exclusive in the same way.

[module/hyprland-workspaces]
type = custom/script
exec = ~/.config/polybar/scripts/hyprland_workspaces.sh
tail = true
; This script will need to be created. It should output the current workspaces
; in a Polybar-friendly format, e.g., "1 2 3 4: 5".
; You'll need to use `hyprctl workspaces` and `hyprctl clients` to get the info.
; For icons, you'll need to map them manually in the script.
click-left = hyprctl dispatch workspace %{F-}

[module/mpris]
type = custom/script
exec = ~/.config/polybar/scripts/mpris_polybar.sh
tail = true
click-left = playerctl play-pause
click-middle = playerctl previous
click-right = playerctl next
scroll-up = playerctl volume 5+
scroll-down = playerctl volume 5-
; This script needs to be created to format the output like Waybar's mpris module.
; It will need to use `playerctl` commands to get current song, artist, player, and status.
; You'll also need to implement the player/status icons within the script.

[module/battery]
type = internal/battery
battery = BAT0 ; Adjust if your battery is named differently
adapter = ACAD
full-at = 99
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-full = %percentage%%
format-charging-foreground = ${colors.foreground}
format-discharging-foreground = ${colors.foreground}
format-full-foreground = ${colors.foreground}

ramp-capacity-0 = 
ramp-capacity-1 = 
